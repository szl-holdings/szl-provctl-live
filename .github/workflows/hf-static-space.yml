name: Governed static Space release

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hf-static-space-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-static-space
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Verify exact checkout and release contracts
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATOR_VENV: ${{ runner.temp }}/hf-validator-venv
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(python -I -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test ! -e "$VALIDATOR_VENV"
          python -I -m venv "$VALIDATOR_VENV"
          VALIDATOR_PYTHON="$VALIDATOR_VENV/bin/python"
          test "$($VALIDATOR_PYTHON -I -c 'import platform; print(platform.python_version())')" = "3.12.13"
          "$VALIDATOR_PYTHON" -I -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --ignore-installed \
            -r requirements/hf-validator.lock
          "$VALIDATOR_PYTHON" -I -c \
            'import importlib.metadata as m, yaml; assert m.version("PyYAML") == "6.0.3" == yaml.__version__'
          "$VALIDATOR_PYTHON" -I -m unittest discover -s tests -v
          "$VALIDATOR_PYTHON" -I scripts/hf_static_space.py build \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/hf-static-space"
          "$VALIDATOR_PYTHON" -I scripts/hf_static_space.py validate \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/hf-static-space"
      - name: Validate exact-head pull-request body evidence
        if: github.event_name == 'pull_request'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -I scripts/hf_static_space.py pr-body \
            --source-sha "$SOURCE_SHA" \
            --event "$GITHUB_EVENT_PATH"

  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact event head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Validate every exact-range commit DCO trailer
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DCO_HEAD_SHA"
          python scripts/hf_static_space.py dco \
            --base-sha "$DCO_BASE_SHA" \
            --head-sha "$DCO_HEAD_SHA"

  authorize:
    name: authorize-exact-governed-merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, dco]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      authorization-outcome: ${{ steps.authorization.outcome }}
      authorization-evidence-outcome: ${{ steps.authorization-evidence.outcome }}
      bundle-outcome: ${{ steps.bundle.outcome }}
      publisher-input-outcome: ${{ steps.publisher-input.outcome }}
      publisher-digests-outcome: ${{ steps.publisher-digests.outcome }}
      publisher-input-evidence-outcome: ${{ steps.publisher-input-evidence.outcome }}
      publisher-input-artifact-name: hf-static-space-publisher-input-${{ github.sha }}-${{ github.run_attempt }}
      publisher_script_sha256: ${{ steps.publisher-digests.outputs.publisher_script_sha256 }}
      publisher_lock_sha256: ${{ steps.publisher-digests.outputs.publisher_lock_sha256 }}
      publisher_config_sha256: ${{ steps.publisher-digests.outputs.publisher_config_sha256 }}
      authorization_sha256: ${{ steps.publisher-digests.outputs.authorization_sha256 }}
      bundle_manifest_sha256: ${{ steps.publisher-digests.outputs.bundle_manifest_sha256 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact protected-main event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Authorize the exact governed merge without HF credentials
        id: authorization
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -I scripts/hf_static_space.py guard \
            --source-sha "$SOURCE_SHA" \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/governed-merge.json" \
            --failure-output "$RUNNER_TEMP/governed-merge-failure.json"
      - name: Build and validate exact source-bound publisher input
        id: bundle
        if: steps.authorization.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -I scripts/hf_static_space.py build \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/hf-static-space"
          python -I scripts/hf_static_space.py validate \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/hf-static-space"
      - name: Stage immutable publisher input
        id: publisher-input
        if: steps.authorization.outcome == 'success' && steps.bundle.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          INPUT="$RUNNER_TEMP/publisher-input"
          mkdir -p "$INPUT/scripts" "$INPUT/requirements"
          install -m 0644 .hf-space.json "$INPUT/.hf-space.json"
          install -m 0644 scripts/hf_static_space.py "$INPUT/scripts/hf_static_space.py"
          install -m 0644 requirements/hf-publisher.lock "$INPUT/requirements/hf-publisher.lock"
          install -m 0644 "$RUNNER_TEMP/governed-merge.json" "$INPUT/governed-merge.json"
          cp -R "$RUNNER_TEMP/hf-static-space" "$INPUT/hf-static-space"
      - name: Bind five exact publisher inputs outside the artifact channel
        id: publisher-digests
        if: steps.publisher-input.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          emit_digest() {
            local name="$1"
            local path="$2"
            test -f "$path"
            test ! -L "$path"
            local digest
            digest="$(sha256sum "$path")"
            digest="${digest%% *}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            printf '%s=%s\n' "$name" "$digest" >> "$GITHUB_OUTPUT"
          }
          emit_digest publisher_script_sha256 scripts/hf_static_space.py
          emit_digest publisher_lock_sha256 requirements/hf-publisher.lock
          emit_digest publisher_config_sha256 .hf-space.json
          emit_digest authorization_sha256 "$RUNNER_TEMP/governed-merge.json"
          emit_digest bundle_manifest_sha256 "$RUNNER_TEMP/hf-static-space/hf-deploy-manifest.json"
      - name: Upload exact publisher input
        id: publisher-input-evidence
        if: steps.publisher-input.outcome == 'success' && steps.publisher-digests.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-static-space-publisher-input-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-input
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload governed-merge authorization evidence
        id: authorization-evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-static-space-authorization-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/governed-merge.json
            ${{ runner.temp }}/governed-merge-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Require exact governed authorization
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.authorization.outcome }}" = "success"
          test "${{ steps.bundle.outcome }}" = "success"
          test "${{ steps.publisher-input.outcome }}" = "success"
          test "${{ steps.publisher-digests.outcome }}" = "success"
          test "${{ steps.publisher-input-evidence.outcome }}" = "success"
          test "${{ steps.authorization-evidence.outcome }}" = "success"

  deploy:
    name: publish-exact-protected-main
    if: always() && needs.authorize.result == 'success' && needs.authorize.outputs.authorization-outcome == 'success' && needs.authorize.outputs.authorization-evidence-outcome == 'success' && needs.authorize.outputs.publisher-digests-outcome == 'success' && needs.authorize.outputs.publisher-input-evidence-outcome == 'success'
    needs: [authorize]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHER_PYTHON: python
      SOURCE_SHA: ${{ github.sha }}
    outputs:
      publisher-input-outcome: ${{ steps.publisher-input.outcome }}
      publisher-rebind-outcome: ${{ steps.publisher-rebind.outcome }}
      publisher-environment-outcome: ${{ steps.publisher-environment.outcome }}
      publisher-freshness-outcome: ${{ steps.publisher-freshness.outcome }}
      publish-outcome: ${{ steps.publish.outcome }}
      publisher-evidence-outcome: ${{ steps.publisher-evidence.outcome }}
      publication-artifact-name: hf-static-space-publication-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Download exact authorized publisher input
        id: publisher-input
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authorize.outputs.publisher-input-artifact-name }}
          path: ${{ runner.temp }}/publisher-input
      - name: Rebind five publisher inputs before interpretation or credentials
        id: publisher-rebind
        if: steps.publisher-input.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_PUBLISHER_SCRIPT_SHA256: ${{ needs.authorize.outputs.publisher_script_sha256 }}
          EXPECTED_PUBLISHER_LOCK_SHA256: ${{ needs.authorize.outputs.publisher_lock_sha256 }}
          EXPECTED_PUBLISHER_CONFIG_SHA256: ${{ needs.authorize.outputs.publisher_config_sha256 }}
          EXPECTED_AUTHORIZATION_SHA256: ${{ needs.authorize.outputs.authorization_sha256 }}
          EXPECTED_BUNDLE_MANIFEST_SHA256: ${{ needs.authorize.outputs.bundle_manifest_sha256 }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          INPUT="$RUNNER_TEMP/publisher-input"
          require_digest() {
            local expected="$1"
            local path="$2"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test -f "$path"
            test ! -L "$path"
            local actual
            actual="$(sha256sum "$path")"
            actual="${actual%% *}"
            test "$actual" = "$expected"
          }
          require_digest "$EXPECTED_PUBLISHER_SCRIPT_SHA256" "$INPUT/scripts/hf_static_space.py"
          require_digest "$EXPECTED_PUBLISHER_LOCK_SHA256" "$INPUT/requirements/hf-publisher.lock"
          require_digest "$EXPECTED_PUBLISHER_CONFIG_SHA256" "$INPUT/.hf-space.json"
          require_digest "$EXPECTED_AUTHORIZATION_SHA256" "$INPUT/governed-merge.json"
          require_digest "$EXPECTED_BUNDLE_MANIFEST_SHA256" "$INPUT/hf-static-space/hf-deploy-manifest.json"
      - name: Set up exact Python
        if: steps.publisher-rebind.outcome == 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install pinned Hugging Face client without repository credentials
        id: publisher-environment
        if: steps.publisher-rebind.outcome == 'success'
        continue-on-error: true
        env:
          PUBLISHER_VENV: ${{ runner.temp }}/hf-publisher-venv
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publication-evidence"
          test "$(python -I -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test ! -e "$PUBLISHER_VENV"
          python -I -m venv "$PUBLISHER_VENV"
          PUBLISHER_PYTHON="$PUBLISHER_VENV/bin/python"
          "$PUBLISHER_PYTHON" -I -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --ignore-installed \
            -r "$RUNNER_TEMP/publisher-input/requirements/hf-publisher.lock"
          "$PUBLISHER_PYTHON" -I -c \
            'import importlib.metadata as m, huggingface_hub as h; assert m.version("huggingface-hub") == "1.19.0" == h.__version__'
          echo "PUBLISHER_PYTHON=$PUBLISHER_PYTHON" >> "$GITHUB_ENV"
          echo "PUBLISHER_VENV=$PUBLISHER_VENV" >> "$GITHUB_ENV"
      - name: Classify publisher-environment failure before credential materialization
        if: always() && steps.publisher-rebind.outcome == 'success' && steps.publisher-environment.outcome != 'success'
        run: |
          set -euo pipefail
          python -I "$RUNNER_TEMP/publisher-input/scripts/hf_static_space.py" stage-failure \
            --source-sha "$SOURCE_SHA" \
            --stage publisher_environment \
            --output "$RUNNER_TEMP/publication-evidence/hf-workflow-stage-failure.json"
      - name: Reconfirm public main at exact source revision without credentials
        id: publisher-freshness
        if: steps.publisher-rebind.outcome == 'success' && steps.publisher-environment.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          HF_TOKEN: ""
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-main-home" "$RUNNER_TEMP/public-main-cache" "$RUNNER_TEMP/publication-evidence"
          chmod 0700 "$RUNNER_TEMP/public-main-home" "$RUNNER_TEMP/public-main-cache"
          /usr/bin/env -i \
            HOME="$RUNNER_TEMP/public-main-home" \
            HF_HOME="$RUNNER_TEMP/public-main-cache" \
            XDG_CACHE_HOME="$RUNNER_TEMP/public-main-cache" \
            PATH="$RUNNER_TEMP/hf-publisher-venv/bin:/usr/bin:/bin" \
            LANG="C.UTF-8" \
            LC_ALL="C.UTF-8" \
            PYTHONIOENCODING="utf-8" \
            "$PUBLISHER_PYTHON" -I "$RUNNER_TEMP/publisher-input/scripts/hf_static_space.py" fresh-main \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/publication-evidence/github-main-preflight-freshness.json"
      - name: Classify public-main freshness failure before mutation
        if: always() && steps.publisher-rebind.outcome == 'success' && steps.publisher-environment.outcome == 'success' && steps.publisher-freshness.outcome != 'success'
        run: |
          set -euo pipefail
          "$PUBLISHER_PYTHON" -I "$RUNNER_TEMP/publisher-input/scripts/hf_static_space.py" stage-failure \
            --source-sha "$SOURCE_SHA" \
            --stage publisher_freshness \
            --output "$RUNNER_TEMP/publication-evidence/hf-workflow-stage-failure.json"
      - name: Publish exact bundle with only the Hugging Face credential
        id: publish
        if: steps.publisher-rebind.outcome == 'success' && steps.publisher-environment.outcome == 'success' && steps.publisher-freshness.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hf-publisher-home" "$RUNNER_TEMP/hf-publisher-cache"
          chmod 0700 "$RUNNER_TEMP/hf-publisher-home" "$RUNNER_TEMP/hf-publisher-cache"
          /usr/bin/env -i \
            HOME="$RUNNER_TEMP/hf-publisher-home" \
            HF_HOME="$RUNNER_TEMP/hf-publisher-cache" \
            XDG_CACHE_HOME="$RUNNER_TEMP/hf-publisher-cache" \
            PATH="$RUNNER_TEMP/hf-publisher-venv/bin:/usr/bin:/bin" \
            LANG="C.UTF-8" \
            LC_ALL="C.UTF-8" \
            PYTHONIOENCODING="utf-8" \
            HF_TOKEN="$HF_TOKEN" \
            "$PUBLISHER_PYTHON" -I "$RUNNER_TEMP/publisher-input/scripts/hf_static_space.py" deploy \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/publisher-input/hf-static-space" \
            --authorization "$RUNNER_TEMP/publisher-input/governed-merge.json" \
            --result "$RUNNER_TEMP/publication-evidence/hf-deploy-result.json" \
            --failure-output "$RUNNER_TEMP/publication-evidence/hf-publication-failure.json" \
            --freshness-output "$RUNNER_TEMP/publication-evidence/github-main-freshness.json"
      - name: Upload publisher outcome before any OIDC privilege exists
        id: publisher-evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-static-space-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Require exact publisher success
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.publisher-input.outcome }}" = "success"
          test "${{ steps.publisher-rebind.outcome }}" = "success"
          test "${{ steps.publisher-environment.outcome }}" = "success"
          test "${{ steps.publisher-freshness.outcome }}" = "success"
          test "${{ steps.publish.outcome }}" = "success"
          test "${{ steps.publisher-evidence.outcome }}" = "success"

  measure:
    name: measure-exact-publication
    if: always() && needs.authorize.result == 'success' && needs.deploy.outputs.publisher-freshness-outcome == 'success' && needs.deploy.outputs.publish-outcome == 'success' && needs.deploy.outputs.publisher-evidence-outcome == 'success'
    needs: [authorize, deploy]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      measurement-hardening-outcome: ${{ steps.measurement-hardening.outcome }}
      measurement-input-outcome: ${{ steps.measurement-input.outcome }}
      measurement-rebind-outcome: ${{ steps.measurement-rebind.outcome }}
      measurement-publisher-evidence-outcome: ${{ steps.measurement-publisher-evidence.outcome }}
      measurement-environment-outcome: ${{ steps.measurement-environment.outcome }}
      measurement-outcome: ${{ steps.measurement.outcome }}
      measurement-evidence-outcome: ${{ steps.measurement-evidence.outcome }}
      measurement-artifact-name: hf-static-space-measurement-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Harden runner
        id: measurement-hardening
        continue-on-error: true
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Download exact authorized publisher input
        id: measurement-input
        if: steps.measurement-hardening.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authorize.outputs.publisher-input-artifact-name }}
          path: ${{ runner.temp }}/publisher-input
      - name: Rebind five measurement inputs before interpretation or credentials
        id: measurement-rebind
        if: steps.measurement-input.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_PUBLISHER_SCRIPT_SHA256: ${{ needs.authorize.outputs.publisher_script_sha256 }}
          EXPECTED_PUBLISHER_LOCK_SHA256: ${{ needs.authorize.outputs.publisher_lock_sha256 }}
          EXPECTED_PUBLISHER_CONFIG_SHA256: ${{ needs.authorize.outputs.publisher_config_sha256 }}
          EXPECTED_AUTHORIZATION_SHA256: ${{ needs.authorize.outputs.authorization_sha256 }}
          EXPECTED_BUNDLE_MANIFEST_SHA256: ${{ needs.authorize.outputs.bundle_manifest_sha256 }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          HF_TOKEN: ""
        run: |
          set -euo pipefail
          INPUT="$RUNNER_TEMP/publisher-input"
          require_digest() {
            local expected="$1"
            local path="$2"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test -f "$path"
            test ! -L "$path"
            local actual
            actual="$(sha256sum "$path")"
            actual="${actual%% *}"
            test "$actual" = "$expected"
          }
          require_digest "$EXPECTED_PUBLISHER_SCRIPT_SHA256" "$INPUT/scripts/hf_static_space.py"
          require_digest "$EXPECTED_PUBLISHER_LOCK_SHA256" "$INPUT/requirements/hf-publisher.lock"
          require_digest "$EXPECTED_PUBLISHER_CONFIG_SHA256" "$INPUT/.hf-space.json"
          require_digest "$EXPECTED_AUTHORIZATION_SHA256" "$INPUT/governed-merge.json"
          require_digest "$EXPECTED_BUNDLE_MANIFEST_SHA256" "$INPUT/hf-static-space/hf-deploy-manifest.json"
      - name: Download exact publisher outcome
        id: measurement-publisher-evidence
        if: steps.measurement-rebind.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.deploy.outputs.publication-artifact-name }}
          path: ${{ runner.temp }}/publication-evidence
      - name: Set up exact Python
        id: measurement-environment
        if: steps.measurement-publisher-evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Measure public bytes and reauthorize current main without HF credentials
        id: measurement
        if: steps.measurement-environment.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ""
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measurement-evidence"
          python -I "$RUNNER_TEMP/publisher-input/scripts/hf_static_space.py" attest \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/publisher-input/hf-static-space" \
            --authorization "$RUNNER_TEMP/publisher-input/governed-merge.json" \
            --event "$GITHUB_EVENT_PATH" \
            --authorization-output "$RUNNER_TEMP/measurement-evidence/post-readback-governed-merge.json" \
            --result "$RUNNER_TEMP/publication-evidence/hf-deploy-result.json" \
            --output "$RUNNER_TEMP/measurement-evidence/hf-live-attestation.json" \
            --failure-output "$RUNNER_TEMP/measurement-evidence/hf-publication-partial.json"
      - name: Upload exact public measurement before OIDC
        id: measurement-evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-static-space-measurement-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/measurement-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Require exact public measurement
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.measurement-hardening.outcome }}" = "success"
          test "${{ steps.measurement-input.outcome }}" = "success"
          test "${{ steps.measurement-rebind.outcome }}" = "success"
          test "${{ steps.measurement-publisher-evidence.outcome }}" = "success"
          test "${{ steps.measurement-environment.outcome }}" = "success"
          test "${{ steps.measurement.outcome }}" = "success"
          test "${{ steps.measurement-evidence.outcome }}" = "success"

  attest:
    name: attest-exact-publication
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [authorize, deploy, measure]
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Harden runner
        id: attestation-hardening
        continue-on-error: true
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          egress-policy: audit
      - name: Checkout exact protected-main evidence synthesizer
        id: attestation-checkout
        if: steps.attestation-hardening.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up exact Python
        id: attestation-environment
        if: steps.attestation-checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          python-version: "3.12.13"
      - name: Download exact publisher outcome
        id: publisher-evidence-download
        if: always() && needs.deploy.outputs.publication-artifact-name != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          name: ${{ needs.deploy.outputs.publication-artifact-name }}
          path: ${{ runner.temp }}/publication-evidence
      - name: Download exact public measurement
        id: measurement-evidence-download
        if: always() && needs.measure.outputs.measurement-artifact-name != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          name: ${{ needs.measure.outputs.measurement-artifact-name }}
          path: ${{ runner.temp }}/measurement-evidence
      - name: Attest canonical exact-revision measurement with GitHub OIDC
        id: oidc
        if: steps.attestation-hardening.outcome == 'success' && steps.attestation-checkout.outcome == 'success' && steps.attestation-environment.outcome == 'success' && needs.measure.outputs.measurement-hardening-outcome == 'success' && needs.measure.outputs.measurement-input-outcome == 'success' && needs.measure.outputs.measurement-rebind-outcome == 'success' && needs.measure.outputs.measurement-publisher-evidence-outcome == 'success' && needs.measure.outputs.measurement-environment-outcome == 'success' && needs.measure.outputs.measurement-outcome == 'success' && needs.measure.outputs.measurement-evidence-outcome == 'success' && steps.publisher-evidence-download.outcome == 'success' && steps.measurement-evidence-download.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/measurement-evidence/hf-live-attestation.json
      - name: Synthesize final receipt or exact workflow-stage failure
        id: workflow-outcome
        if: always()
        continue-on-error: true
        env:
          ATTESTATION_ID: ${{ steps.oidc.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.oidc.outputs.attestation-url }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          HF_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ATTESTATION_HARDENING_OUTCOME: ${{ steps.attestation-hardening.outcome }}
          ATTESTATION_CHECKOUT_OUTCOME: ${{ steps.attestation-checkout.outcome }}
          ATTESTATION_ENVIRONMENT_OUTCOME: ${{ steps.attestation-environment.outcome }}
        run: |
          set -euo pipefail
          synthesis_status=1
          if test "$ATTESTATION_HARDENING_OUTCOME" = "success" && \
             test "$ATTESTATION_CHECKOUT_OUTCOME" = "success" && \
             test "$ATTESTATION_ENVIRONMENT_OUTCOME" = "success"; then
            set +e
            python -I scripts/hf_static_space.py workflow-outcome \
              --source-sha "$SOURCE_SHA" \
              --result "$RUNNER_TEMP/publication-evidence/hf-deploy-result.json" \
              --measurement "$RUNNER_TEMP/measurement-evidence/hf-live-attestation.json" \
              --mutation-failure "$RUNNER_TEMP/publication-evidence/hf-publication-failure.json" \
              --partial "$RUNNER_TEMP/measurement-evidence/hf-publication-partial.json" \
              --receipt "$RUNNER_TEMP/terminal-evidence/hf-oidc-receipt.json" \
              --workflow-failure "$RUNNER_TEMP/terminal-evidence/hf-workflow-stage-failure.json" \
              --authorization-outcome "${{ needs.authorize.outputs.authorization-outcome }}" \
              --authorization-evidence-outcome "${{ needs.authorize.outputs.authorization-evidence-outcome }}" \
              --bundle-outcome "${{ needs.authorize.outputs.bundle-outcome }}" \
              --publisher-input-outcome "${{ needs.authorize.outputs.publisher-input-outcome }}" \
              --publisher-digests-outcome "${{ needs.authorize.outputs.publisher-digests-outcome }}" \
              --publisher-input-evidence-outcome "${{ needs.authorize.outputs.publisher-input-evidence-outcome }}" \
              --publisher-input-download-outcome "${{ needs.deploy.outputs.publisher-input-outcome }}" \
              --publisher-rebind-outcome "${{ needs.deploy.outputs.publisher-rebind-outcome }}" \
              --publisher-environment-outcome "${{ needs.deploy.outputs.publisher-environment-outcome }}" \
              --publisher-freshness-outcome "${{ needs.deploy.outputs.publisher-freshness-outcome }}" \
              --publish-outcome "${{ needs.deploy.outputs.publish-outcome }}" \
              --publisher-evidence-outcome "${{ needs.deploy.outputs.publisher-evidence-outcome }}" \
              --publisher-evidence-download-outcome "${{ steps.publisher-evidence-download.outcome }}" \
              --measurement-hardening-outcome "${{ needs.measure.outputs.measurement-hardening-outcome }}" \
              --measurement-input-outcome "${{ needs.measure.outputs.measurement-input-outcome }}" \
              --measurement-rebind-outcome "${{ needs.measure.outputs.measurement-rebind-outcome }}" \
              --measurement-publisher-evidence-outcome "${{ needs.measure.outputs.measurement-publisher-evidence-outcome }}" \
              --measurement-environment-outcome "${{ needs.measure.outputs.measurement-environment-outcome }}" \
              --measurement-outcome "${{ needs.measure.outputs.measurement-outcome }}" \
              --success-evidence-outcome "${{ needs.measure.outputs.measurement-evidence-outcome }}" \
              --measurement-evidence-download-outcome "${{ steps.measurement-evidence-download.outcome }}" \
              --attestation-hardening-outcome "$ATTESTATION_HARDENING_OUTCOME" \
              --attestation-checkout-outcome "$ATTESTATION_CHECKOUT_OUTCOME" \
              --attestation-environment-outcome "$ATTESTATION_ENVIRONMENT_OUTCOME" \
              --oidc-outcome "${{ steps.oidc.outcome }}" \
              --attestation-id "$ATTESTATION_ID" \
              --attestation-url "$ATTESTATION_URL"
            synthesis_status=$?
            set -e
          fi
          if (( synthesis_status != 0 )); then
            failure_stage="terminal_synthesizer_bootstrap"
            if test "$ATTESTATION_HARDENING_OUTCOME" != "success"; then
              failure_stage="attestation_hardening"
            elif test "$ATTESTATION_CHECKOUT_OUTCOME" != "success"; then
              failure_stage="attestation_checkout"
            elif test "$ATTESTATION_ENVIRONMENT_OUTCOME" != "success"; then
              failure_stage="attestation_environment"
            fi
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || SOURCE_SHA=""
            mkdir -p "$RUNNER_TEMP/terminal-evidence"
            fallback="$RUNNER_TEMP/terminal-evidence/hf-workflow-stage-failure.json"
            printf '%s\n' "{\"deployment_success\":false,\"failure_stage\":\"${failure_stage}\",\"hf_revision\":null,\"receipt_minted\":false,\"schema\":\"szl.hf-workflow-stage-failure/v1\",\"source\":null,\"source_revision\":\"${SOURCE_SHA}\",\"status\":\"WORKFLOW_STAGE_FAILURE\",\"target\":null}" > "${fallback}.tmp"
            mv "${fallback}.tmp" "$fallback"
            rm -f "$RUNNER_TEMP/terminal-evidence/hf-oidc-receipt.json"
          fi
          exit "$synthesis_status"
      - name: Upload terminal governed evidence
        id: terminal-evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          name: hf-static-space-terminal-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication-evidence
            ${{ runner.temp }}/measurement-evidence
            ${{ runner.temp }}/terminal-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Synthesize terminal artifact-upload failure
        if: always() && steps.terminal-evidence.outcome != 'success'
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          HF_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          python -I scripts/hf_static_space.py workflow-outcome \
            --source-sha "$SOURCE_SHA" \
            --result "$RUNNER_TEMP/publication-evidence/hf-deploy-result.json" \
            --measurement "$RUNNER_TEMP/measurement-evidence/hf-live-attestation.json" \
            --mutation-failure "$RUNNER_TEMP/publication-evidence/hf-publication-failure.json" \
            --partial "$RUNNER_TEMP/measurement-evidence/hf-publication-partial.json" \
            --receipt "$RUNNER_TEMP/terminal-evidence/hf-oidc-receipt.json" \
            --workflow-failure "$RUNNER_TEMP/terminal-evidence/hf-workflow-stage-failure.json" \
            --authorization-outcome "${{ needs.authorize.outputs.authorization-outcome }}" \
            --authorization-evidence-outcome "${{ needs.authorize.outputs.authorization-evidence-outcome }}" \
            --bundle-outcome "${{ needs.authorize.outputs.bundle-outcome }}" \
            --publisher-input-outcome "${{ needs.authorize.outputs.publisher-input-outcome }}" \
            --publisher-digests-outcome "${{ needs.authorize.outputs.publisher-digests-outcome }}" \
            --publisher-input-evidence-outcome "${{ needs.authorize.outputs.publisher-input-evidence-outcome }}" \
            --publisher-input-download-outcome "${{ needs.deploy.outputs.publisher-input-outcome }}" \
            --publisher-rebind-outcome "${{ needs.deploy.outputs.publisher-rebind-outcome }}" \
            --publisher-environment-outcome "${{ needs.deploy.outputs.publisher-environment-outcome }}" \
            --publisher-freshness-outcome "${{ needs.deploy.outputs.publisher-freshness-outcome }}" \
            --publish-outcome "${{ needs.deploy.outputs.publish-outcome }}" \
            --publisher-evidence-outcome "${{ needs.deploy.outputs.publisher-evidence-outcome }}" \
            --publisher-evidence-download-outcome "${{ steps.publisher-evidence-download.outcome }}" \
            --measurement-hardening-outcome "${{ needs.measure.outputs.measurement-hardening-outcome }}" \
            --measurement-input-outcome "${{ needs.measure.outputs.measurement-input-outcome }}" \
            --measurement-rebind-outcome "${{ needs.measure.outputs.measurement-rebind-outcome }}" \
            --measurement-publisher-evidence-outcome "${{ needs.measure.outputs.measurement-publisher-evidence-outcome }}" \
            --measurement-environment-outcome "${{ needs.measure.outputs.measurement-environment-outcome }}" \
            --measurement-outcome "${{ needs.measure.outputs.measurement-outcome }}" \
            --success-evidence-outcome "${{ needs.measure.outputs.measurement-evidence-outcome }}" \
            --measurement-evidence-download-outcome "${{ steps.measurement-evidence-download.outcome }}" \
            --attestation-hardening-outcome "${{ steps.attestation-hardening.outcome }}" \
            --attestation-checkout-outcome "${{ steps.attestation-checkout.outcome }}" \
            --attestation-environment-outcome "${{ steps.attestation-environment.outcome }}" \
            --oidc-outcome "${{ steps.oidc.outcome }}" \
            --force-failure-stage terminal_evidence_upload
      - name: Upload terminal failure evidence
        if: always() && steps.terminal-evidence.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          name: hf-static-space-terminal-upload-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence/hf-workflow-stage-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Require terminal governed success
        if: always()
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        run: |
          set -euo pipefail
          test "${{ needs.authorize.outputs.authorization-outcome }}" = "success"
          test "${{ needs.authorize.outputs.authorization-evidence-outcome }}" = "success"
          test "${{ needs.authorize.outputs.bundle-outcome }}" = "success"
          test "${{ needs.authorize.outputs.publisher-input-outcome }}" = "success"
          test "${{ needs.authorize.outputs.publisher-digests-outcome }}" = "success"
          test "${{ needs.authorize.outputs.publisher-input-evidence-outcome }}" = "success"
          test "${{ needs.deploy.outputs.publisher-input-outcome }}" = "success"
          test "${{ needs.deploy.outputs.publisher-rebind-outcome }}" = "success"
          test "${{ needs.deploy.outputs.publisher-environment-outcome }}" = "success"
          test "${{ needs.deploy.outputs.publisher-freshness-outcome }}" = "success"
          test "${{ needs.deploy.outputs.publish-outcome }}" = "success"
          test "${{ needs.deploy.outputs.publisher-evidence-outcome }}" = "success"
          test "${{ steps.publisher-evidence-download.outcome }}" = "success"
          test "${{ needs.measure.outputs.measurement-hardening-outcome }}" = "success"
          test "${{ needs.measure.outputs.measurement-input-outcome }}" = "success"
          test "${{ needs.measure.outputs.measurement-rebind-outcome }}" = "success"
          test "${{ needs.measure.outputs.measurement-publisher-evidence-outcome }}" = "success"
          test "${{ needs.measure.outputs.measurement-environment-outcome }}" = "success"
          test "${{ needs.measure.outputs.measurement-outcome }}" = "success"
          test "${{ needs.measure.outputs.measurement-evidence-outcome }}" = "success"
          test "${{ steps.measurement-evidence-download.outcome }}" = "success"
          test "${{ steps.attestation-hardening.outcome }}" = "success"
          test "${{ steps.attestation-checkout.outcome }}" = "success"
          test "${{ steps.attestation-environment.outcome }}" = "success"
          test "${{ steps.oidc.outcome }}" = "success"
          test "${{ steps.workflow-outcome.outcome }}" = "success"
          test "${{ steps.terminal-evidence.outcome }}" = "success"
          test -f "$RUNNER_TEMP/terminal-evidence/hf-oidc-receipt.json"
          test ! -f "$RUNNER_TEMP/terminal-evidence/hf-workflow-stage-failure.json"

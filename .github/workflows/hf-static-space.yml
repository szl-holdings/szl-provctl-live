name: Governed static Space release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hf-static-space-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-static-space
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Verify exact checkout and release contracts
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATOR_VENV: ${{ runner.temp }}/hf-validator-venv
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(python -I -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test ! -e "$VALIDATOR_VENV"
          python -I -m venv "$VALIDATOR_VENV"
          VALIDATOR_PYTHON="$VALIDATOR_VENV/bin/python"
          test "$($VALIDATOR_PYTHON -I -c 'import platform; print(platform.python_version())')" = "3.12.13"
          "$VALIDATOR_PYTHON" -I -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --ignore-installed \
            -r requirements/hf-publisher.lock
          "$VALIDATOR_PYTHON" -I -c \
            'import importlib.metadata as m, huggingface_hub as h; assert m.version("huggingface-hub") == "1.19.0" == h.__version__'
          "$VALIDATOR_PYTHON" -I -m unittest discover -s tests -v
          "$VALIDATOR_PYTHON" -I scripts/hf_static_space.py build \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/hf-static-space"
          "$VALIDATOR_PYTHON" -I scripts/hf_static_space.py validate \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/hf-static-space"

  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact event head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Validate every exact-range commit DCO trailer
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DCO_HEAD_SHA"
          python scripts/hf_static_space.py dco \
            --base-sha "$DCO_BASE_SHA" \
            --head-sha "$DCO_HEAD_SHA"

  deploy:
    name: publish-exact-protected-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, dco]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact protected-main event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Build and validate exact source-bound bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python scripts/hf_static_space.py build \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/hf-static-space"
          python scripts/hf_static_space.py validate \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/hf-static-space"
      - name: Mint least-privilege governed ruleset reader
        id: governance-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: read
      - name: Require governed ruleset reader token
        env:
          GOVERNANCE_TOKEN: ${{ steps.governance-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_TOKEN"
      - name: Reauthorize exact governed main without HF credentials
        env:
          GITHUB_TOKEN: ${{ steps.governance-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/hf_static_space.py guard --source-sha "$SOURCE_SHA"
      - name: Install pinned Hugging Face client in a clean exact-Python venv
        env:
          PUBLISHER_VENV: ${{ runner.temp }}/hf-publisher-venv
        run: |
          set -euo pipefail
          test "$(python -I -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test ! -e "$PUBLISHER_VENV"
          python -I -m venv "$PUBLISHER_VENV"
          PUBLISHER_PYTHON="$PUBLISHER_VENV/bin/python"
          "$PUBLISHER_PYTHON" -I -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --ignore-installed \
            -r requirements/hf-publisher.lock
          "$PUBLISHER_PYTHON" -I -c \
            'import importlib.metadata as m, huggingface_hub as h; assert m.version("huggingface-hub") == "1.19.0" == h.__version__'
          echo "PUBLISHER_PYTHON=$PUBLISHER_PYTHON" >> "$GITHUB_ENV"
      - name: Publish exact bundle with optimistic target lock
        id: publish
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.governance-token.outputs.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          "$PUBLISHER_PYTHON" -I scripts/hf_static_space.py deploy \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/hf-static-space" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --failure-output "$RUNNER_TEMP/hf-publication-failure.json"
      - name: Attest exact running revision, bytes, and public source identity
        id: measurement
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.governance-token.outputs.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          "$PUBLISHER_PYTHON" -I scripts/hf_static_space.py attest \
            --source-sha "$SOURCE_SHA" \
            --bundle "$RUNNER_TEMP/hf-static-space" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --output "$RUNNER_TEMP/hf-live-attestation.json" \
            --failure-output "$RUNNER_TEMP/hf-publication-partial.json"
      - name: Upload exact local measurement before OIDC
        id: success-evidence
        if: steps.measurement.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-static-space-local-measurement
          path: |
            ${{ runner.temp }}/hf-static-space/hf-deploy-manifest.json
            ${{ runner.temp }}/hf-static-space/SPACE_PROVENANCE.json
            ${{ runner.temp }}/hf-deploy-result.json
            ${{ runner.temp }}/hf-live-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Attest canonical exact-revision measurement with GitHub OIDC
        id: oidc
        if: steps.measurement.outcome == 'success' && steps.success-evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/hf-live-attestation.json
      - name: Synthesize final receipt or workflow-stage failure
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          ATTESTATION_ID: ${{ steps.oidc.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.oidc.outputs.attestation-url }}
        run: |
          set -euo pipefail
          "$PUBLISHER_PYTHON" -I scripts/hf_static_space.py workflow-outcome \
            --source-sha "$SOURCE_SHA" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --measurement "$RUNNER_TEMP/hf-live-attestation.json" \
            --mutation-failure "$RUNNER_TEMP/hf-publication-failure.json" \
            --partial "$RUNNER_TEMP/hf-publication-partial.json" \
            --receipt "$RUNNER_TEMP/hf-oidc-receipt.json" \
            --workflow-failure "$RUNNER_TEMP/hf-workflow-stage-failure.json" \
            --publish-outcome "${{ steps.publish.outcome }}" \
            --measurement-outcome "${{ steps.measurement.outcome }}" \
            --success-evidence-outcome "${{ steps.success-evidence.outcome }}" \
            --oidc-outcome "${{ steps.oidc.outcome }}" \
            --attestation-id "$ATTESTATION_ID" \
            --attestation-url "$ATTESTATION_URL"
      - name: Upload terminal governed evidence
        id: terminal-evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-static-space-terminal-evidence
          path: |
            ${{ runner.temp }}/hf-static-space/hf-deploy-manifest.json
            ${{ runner.temp }}/hf-static-space/SPACE_PROVENANCE.json
            ${{ runner.temp }}/hf-deploy-result.json
            ${{ runner.temp }}/hf-live-attestation.json
            ${{ runner.temp }}/hf-publication-failure.json
            ${{ runner.temp }}/hf-publication-partial.json
            ${{ runner.temp }}/hf-oidc-receipt.json
            ${{ runner.temp }}/hf-workflow-stage-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Synthesize terminal artifact-upload failure
        if: always() && steps.terminal-evidence.outcome != 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          "$PUBLISHER_PYTHON" -I scripts/hf_static_space.py workflow-outcome \
            --source-sha "$SOURCE_SHA" \
            --result "$RUNNER_TEMP/hf-deploy-result.json" \
            --measurement "$RUNNER_TEMP/hf-live-attestation.json" \
            --mutation-failure "$RUNNER_TEMP/hf-publication-failure.json" \
            --partial "$RUNNER_TEMP/hf-publication-partial.json" \
            --receipt "$RUNNER_TEMP/hf-oidc-receipt.json" \
            --workflow-failure "$RUNNER_TEMP/hf-workflow-stage-failure.json" \
            --publish-outcome "${{ steps.publish.outcome }}" \
            --measurement-outcome "${{ steps.measurement.outcome }}" \
            --success-evidence-outcome "${{ steps.success-evidence.outcome }}" \
            --oidc-outcome "${{ steps.oidc.outcome }}" \
            --force-failure-stage terminal_evidence_upload
      - name: Upload terminal failure evidence
        if: always() && steps.terminal-evidence.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-static-space-terminal-upload-failure
          path: ${{ runner.temp }}/hf-workflow-stage-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Require terminal governed success
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.publish.outcome }}" = "success"
          test "${{ steps.measurement.outcome }}" = "success"
          test "${{ steps.success-evidence.outcome }}" = "success"
          test "${{ steps.oidc.outcome }}" = "success"
          test "${{ steps.terminal-evidence.outcome }}" = "success"
          test -f "$RUNNER_TEMP/hf-oidc-receipt.json"
          test ! -f "$RUNNER_TEMP/hf-workflow-stage-failure.json"
